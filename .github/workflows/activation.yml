name: CoE activation
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  activation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python3 -m unittest discover -s tests -v
